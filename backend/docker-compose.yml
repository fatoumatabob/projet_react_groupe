version: "3.8"

services:
  # 🚀 Backend Laravel
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "8000:8000"   # expose l'API sur localhost:8000
    depends_on:
      - mysql
    networks:
      - laravel

  # 🛢 Base de données MySQL
  mysql:
    image: mysql:8.0
    container_name: laravel-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: laravel
      MYSQL_USER: laravel
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel

  # 🎨 Frontend React
  frontend:
    build:
      context: ./frontend   # 📂 ton projet React doit être dans ce dossier
      dockerfile: Dockerfile
    container_name: react-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"   # accessible via localhost:3000
    stdin_open: true
    tty: true
    networks:
      - laravel

networks:
  laravel:

volumes:
  db_data:
